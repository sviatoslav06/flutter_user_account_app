name: flutter_user_account_app
description: A Flutter app for user account management (frontend only)
version: 1.0.0+1
environment:
  sdk: ">=2.17.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_slidable: ^4.0.3
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  # Pin to 5.x to keep compatibility with existing sign-in code
  google_sign_in: ^5.4.0
  cached_network_image: ^3.2.4
  firebase_crashlytics: ^5.0.3
  firebase_analytics: ^12.0.3
  cloud_firestore: ^6.1.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  provider: ^6.0.5
  shared_preferences: ^2.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/images/Register.png
    - assets/images/Login.png
    - assets/images/Avatar.png
